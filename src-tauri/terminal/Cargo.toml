[package]
name = "ask-terminal"
version = "0.3.6"
edition = "2021"
rust-version = "1.90"
description = "ASK Desktop: Terminal-Server (Ersatz für open-terminal, ohne Python)"
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
calamine = { version = "0.38", default-features = false }
encoding_rs = "0.8"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
mailparse = "0.15"
parking_lot = "0.12"
percent-encoding = "2"
rand = "0.9"
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_IO", "Win32_Globalization"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
