[workspace]
members = [".", "core", "terminal"]
resolver = "2"

[package]
name = "ask"
version = "0.3.9"
edition = "2021"
rust-version = "1.90"
description = "ASK Desktop: Open WebUI der TF Bern mit lokalem Arbeitsordner"
authors = ["TF Bern"]
license = "UNLICENSED"
publish = false
default-run = "ask"

[lib]
name = "ask_lib"
crate-type = ["rlib"]

[[bin]]
name = "ask"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ask-core = { path = "core" }
ask-terminal = { path = "terminal" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
url = "2"
percent-encoding = "2"
tauri = { version = "2", features = ["unstable", "devtools", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Graphics_Gdi"] }

tauri-winrt-notification = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"

strip = true

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
