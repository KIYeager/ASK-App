# Baut ASK auf Windows und veröffentlicht Installer, einzelne EXE und latest.yml im öffentlichen
# Repository KIYeager/ASK-Releases (ENTSCHEIDE E37, E38). Zwei Wege:
# - Merge eines PRs in main mit Label «beta» oder «release»: Job «version» setzt die nächste Version
#   (oder die aus der Zeile «Version: …» im PR), macht Commit und Tag auf main, dann baut «release».
#   Label «kein-release»: nichts. Die Wahl prüft release-label.yml schon im PR.
# - Tag von Hand: npm run release -- <Version> "Was ist neu" (scripts/release.js).
# Braucht das Secret RELEASES_TOKEN: Fine-grained Token nur für ASK-Releases, Recht «Contents: Read and write»,
# und TAURI_SIGNING_PRIVATE_KEY (mit TAURI_SIGNING_PRIVATE_KEY_PASSWORD) zum Signieren der Updates (ENTSCHEIDE E60).
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged &&
      (contains(github.event.pull_request.labels.*.name, 'beta') || contains(github.event.pull_request.labels.*.name, 'release')) &&
      !contains(github.event.pull_request.labels.*.name, 'kein-release')
    runs-on: ubuntu-latest
    # Merges nacheinander: jede Version baut auf dem Commit der vorherigen auf.
    concurrency:
      group: release-version
      cancel-in-progress: false
    permissions:
      contents: write # Commit «Version …» und Tag auf main
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version setzen, Commit und Tag
        id: bump
        env:
          KIND: ${{ contains(github.event.pull_request.labels.*.name, 'beta') && 'beta' || 'release' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.js --auto "$KIND"

  release:
    needs: version
    # Bei einem Tag von Hand ist «version» übersprungen; beim Merge nur, wenn «version» einen Tag gesetzt hat.
    if: always() && (github.event_name == 'push' || needs.version.outputs.tag != '')
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: release-${{ needs.version.outputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.version.outputs.tag || github.ref_name }}
      # gleich wie in ci.yml, sonst passt der Schlüssel des gemeinsamen Zwischenspeichers nicht
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref }}

      - name: Version prüfen
        id: version
        env:
          HAS_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG passt nicht zu package.json ($version)." }
          if ($env:HAS_TOKEN -ne 'true') { throw "Secret RELEASES_TOKEN fehlt (siehe README, Abschnitt «Neue Version veröffentlichen»)." }
          if ($env:HAS_KEY -ne 'true') { throw "Secret TAURI_SIGNING_PRIVATE_KEY fehlt (siehe README, Abschnitt «Updates signieren»)." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "beta=$(if ($version -match '-') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "ASK_BUILD_DIR=$env:RUNNER_TEMP\ask-build" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Zwischenspeicher aus der CI auf main (shared-key «windows», dort mit Release-Build); hier nur lesen,
      # ein Release läuft im Bereich des PRs und würde ihn für spätere Releases nicht finden (ENTSCHEIDE E66)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows
          save-if: false

      - name: npm-Pakete
        run: npm ci --no-audit --no-fund

      # Beim Merge hat die CI dieselben Prüfungen im PR schon bestanden; nur ein Tag von Hand prüft hier
      - name: Lint und Tests
        if: github.event_name == 'push'
        run: |
          npm run lint
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: Python-Paket aus dem Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\ask-build\cache
          key: python-${{ hashFiles('scripts/build-python.ps1') }}

      - name: Python bauen
        shell: powershell
        run: scripts\build-python.ps1 -BuildDir $env:ASK_BUILD_DIR

      # Release-Text aus dem Tag (npm run release schreibt ihn hinein): im Update-Dialog und als «Neu in ASK»
      # in der App (ENTSCHEIDE E64). Den Tag neu holen: checkout macht aus einem annotierten Tag sonst
      # unter Umständen einen leichten.
      - name: Release-Text
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          git fetch --force origin "refs/tags/v$($version):refs/tags/v$($version)" 2>$null
          $notes = (git tag -l --format='%(contents)' "v$version" | Out-String).Trim()
          if (-not $notes -or $notes -eq "v$version") { $notes = "Neue Version $version." }
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content $notesFile -Encoding utf8 -Value $notes
          "ASK_NOTES_FILE=$notesFile" >> $env:GITHUB_ENV

      - name: Installer bauen
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run dist

      - name: Einzelne EXE bauen
        run: npm run dist:portable

      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          $dist = Join-Path $env:ASK_BUILD_DIR 'dist'
          $setup = Join-Path $dist "ASK-Setup-$env:VERSION.exe"
          $portable = Join-Path $dist "ASK-$env:VERSION.exe"
          # Feste Namen für den Link «neueste Version» (releases/latest/download/ASK-Setup.exe)
          $out = Join-Path $env:RUNNER_TEMP 'upload'
          $manifests = Join-Path $env:RUNNER_TEMP 'manifests'
          New-Item -ItemType Directory -Force $out, $manifests | Out-Null
          Copy-Item $setup, "$setup.sig", $portable $out
          Copy-Item $setup (Join-Path $out 'ASK-Setup.exe')
          Copy-Item $portable (Join-Path $out 'ASK.exe')

          # Text aus dem Schritt «Release-Text»; die Download-Anleitung steht im README von ASK-Releases, nicht hier.
          $notesFile = $env:ASK_NOTES_FILE

          # Update-Dateien: latest.yml (für die frühere Electron-Fassung) kommt in das Release selbst,
          # latest.json und beta.json (Tauri) in das feste Release «updater» (ENTSCHEIDE E60)
          node scripts/manifests.js $dist $env:VERSION $notesFile $manifests
          if ($LASTEXITCODE -ne 0) { throw "Update-Dateien nicht erstellt" }
          Copy-Item (Join-Path $manifests 'latest.yml') $out

          # Argumente als echte Liste: Ein einzelnes Element aus «if» wird in PowerShell zum Text, und
          # «@flags» mit einem Text gab gh ein einzelnes «-» als Datei (Fehler in v0.2.0).
          [string[]]$ghArgs = @('release', 'create', "v$env:VERSION", '--repo', 'KIYeager/ASK-Releases',
            '--title', "ASK $env:VERSION", '--notes-file', $notesFile)
          $ghArgs += if ($env:BETA -eq 'true') { '--prerelease' } else { '--latest' }
          $ghArgs += [string[]](Get-ChildItem $out -File).FullName
          Write-Host "gh $($ghArgs -join ' ')"
          & gh $ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create fehlgeschlagen" }

          # Release «updater» für die Tauri-Updates anlegen, falls es fehlt (nie «latest»), Dateien ersetzen
          gh release view updater --repo KIYeager/ASK-Releases *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create updater --repo KIYeager/ASK-Releases --title 'Update-Dateien' --latest=false --prerelease `
              --notes 'Nur für die automatischen Updates von ASK. Downloads stehen bei den Versionen.'
            if ($LASTEXITCODE -ne 0) { throw "Release «updater» nicht angelegt" }
          }
          [string[]]$files = (Get-ChildItem $manifests -Filter '*.json' -File).FullName
          gh release upload updater --repo KIYeager/ASK-Releases --clobber @files
          if ($LASTEXITCODE -ne 0) { throw "Update-Dateien nicht hochgeladen" }
