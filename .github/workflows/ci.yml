# Prüft jede Änderung: Lint und Unit-Tests auf Linux (Oberfläche, Skripte, Rust), Terminal-, Skill- und
# Rust-Tests sowie ein Build der App auf Windows. Die End-to-End-Tests laufen weiterhin von Hand,
# siehe docs/TESTPROTOKOLL.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Schneller kompilieren (ENTSCHEIDE E67): ohne Debug-Infos in Tests und Clippy (unter Windows sind PDB teuer)
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  node:
    name: Lint und Unit-Tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test

  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pakete für WebKitGTK (Tauri unter Linux, nur zum Kompilieren)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --no-fail-fast
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      # Word-Export der Docs (ENTSCHEIDE E82): Beispiel mit allem, Sonderfälle und Zufalls-Docs mit dem Validator von
      # Microsoft prüfen, für Word 2007, 2016 und Microsoft 365
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Word-Export prüfen
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1
        run: |
          ASK_DOCX_OUT="$RUNNER_TEMP/beispiel.docx" cargo test --manifest-path src-tauri/Cargo.toml -p ask-core docx::tests::beispiel_mit_allem -- --ignored
          dotnet run --project tests/docx-pruefen -- "$RUNNER_TEMP"/beispiel.docx*

  python:
    name: Lint und Tests ohne Windows (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install ruff
      - run: ruff check python resources/skills tests scripts

  windows:
    name: Rust, Terminal und Skills (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: 'pip install --only-binary=:all: -r python/requirements.txt'
      - run: python -m unittest tests/test_skills.py -v
      # Unit-Tests auch unter Windows (Pfade, Kurznamen wie RUNNER~1): sonst fällt das erst im Release auf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      # Rust unter Windows (Pfade, Low Integrity, WebView2) und ein Build der App ohne Installer
      - uses: dtolnay/rust-toolchain@stable
      # Gemeinsamer Zwischenspeicher mit dem Release-Workflow (shared-key): Der Build auf main hält ihn warm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows
      # Enthält den Terminal-Server: Low Integrity der Befehle, Ordner mit Umlaut, OEM-Ausgabe, Job-Objekt
      # (src-tauri/terminal und src-tauri/tests/terminal_e2e.rs)
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --no-fail-fast
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      # Release-Build nur auf main: Er füllt den Zwischenspeicher, aus dem der Release-Workflow baut; in PRs
      # prüfen Tests und Clippy das Kompilieren schon, der Release baut ohnehin selbst
      - if: github.event_name == 'push'
        run: npm run build:ui
      - if: github.event_name == 'push'
        run: cargo build --manifest-path src-tauri/Cargo.toml --release
